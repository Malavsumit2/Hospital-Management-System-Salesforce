<html>
    <head>
        <h1>Java Script can change Image</h1>
        
    </head>
    <body>
         <img id="myImage" onclick="changeImage()"
        src="Accenture.png" style="width:100px; height:180px;">
        <script>
            function changeImage() {
                var image = document.getElementById('myImage');
                if (image.src.match("Accenture")) {
                    image.src = "Infosys.jpg";
                } else {
                    image.src = "Accenture.png";
                }
            }
        </script>

    </body>

</html>
