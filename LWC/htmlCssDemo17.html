<html>
    <head>
        <title>Assignment</title>
    </head>
    <body>
        <h1>Convert Celsius to Fahrenheit</h1>
        <p id="demo"></p>
        <input type="number" id="celsiusInput" placeholder="Enter Celsius value">
        
        <script>
            function convertCelsiusToFahrenheit(celsius) {
                var celsiusValue = document.getElementById("celsiusInput").value;
                
                var fahrenheit = (celsiusValue * 9/5) + 32;
                return fahrenheit;

               
            }
          
        </script>

        <button type="button" onclick="
        let fahrenheit = convertCelsiusToFahrenheit();
        let celciusValue = document.getElementById('celsiusInput').value;
        document.getElementById('demo').innerHTML = celciusValue + '°C is equal to ' + fahrenheit + '°F';">Convert to Fahrenheit</button>

    </body>
</html>
