<html>
    <head>
        <h1>Java Script Array </h1>
        <h2> Looping an Array </h2>
        
    </head>
    <body>
            <p id="demo"></p>
            <script>
                const fruits = ["Banana", "Orange", "Apple", "Mango"];
                let flen = fruits.length;
                let text = "<ul style='color:blue; font-size:20px; list-style-type:circle;'>";
                for (let i = 0; i < flen; i++) {
                    text += "<li>" + fruits[i] + "</li>";
                }
                text += "</ul>";
                document.getElementById("demo").innerHTML = text;
            </script>
        
    </body>
</html>
