<html>
    <head>
        <title>Java Script Set</title>
    </head>
    <body>
        <h1>Java Script Set</h1>
        <p> Add Values to The Set</p>
        <p id = "demo"> </p>
        <script>
            const mySet = new Set();
            mySet.add('A');
            mySet.add('B');
            mySet.add('C');
            mySet.add('D');
            mySet.add('A'); // Duplicate value, will not be added
            document.getElementById("demo").innerHTML = "The Set values are: " + Array.from(mySet).join(", ") + 
            "<br> The size of the Set is: " + mySet.size;
        </script>
        
    </body> 
</html>
