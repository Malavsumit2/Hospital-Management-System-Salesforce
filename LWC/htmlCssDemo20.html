<html>
    <head>
        <title>Java Script Map</title>
    </head>
    <body>
        <h1>Java Script Map</h1>
        <p> Add Values to The Map</p>
        <p id = "demo"> </p>
        <script>
            const myMap = new Map();
            myMap.set('A', 1);
            myMap.set('B', 2);
            myMap.set('C', 3);
            myMap.set('D', 4);
            myMap.set('A', 5); // Duplicate key, will update the value
            document.getElementById("demo").innerHTML = "The Map values are: " + Array.from(myMap).join(";") + 
            "<br> The size of the Map is: " + myMap.size;
        </script>
</html>
