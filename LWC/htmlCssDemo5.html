<html>
      <head>

           <title> My Second Web Page </title>
           <link rel = ' stylesheet' href = 'style.css'>  <!--This is External CSS-->
           <style>
            table,th,td
            {
                border: 1px solid black;
                border-collapse: collapse;
            }
 
            /* Here we set the padding for th and td elements */
            th,td
            {
                padding: 15px;
               
            }
            
            /* Here we set the text alignment for th and td elements */
            td
            {
                text-align: center;
            }
            table
            {
                background-color: #00c732;
            }


           </style>

      </head>
<body>
    
   <table style="width:100%">
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Jill</td>
            <td>Smith</td>
            <td>50</td>
        </tr>
        <tr>
            <td>Eve</td>
            <td>Jackson</td>
            <td>94</td>
        </tr>
    </table>
</body>
</html>
