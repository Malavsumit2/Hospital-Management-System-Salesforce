<html>
    <head>
        <style>
            #para1 { /* This is an ID selector that targets the element with the ID "para1"
            We can use this to apply unique styles to a specific element */
                color: red;
                font-size: 20px;
                text-align: center;
            }
        </style>
    </head>
<body>
    /*This is not the best practise to use Id with multiple elements. It is better to use class for multiple elements. */
    <p id="para1">This is a paragraph with red text, 20px font size, and centered alignment.</p>
    <h1 id="para1">This is a heading with red text, 20px font size, and centered alignment.</h1>
</body>






</html>
