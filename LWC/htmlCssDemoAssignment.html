<html>
    <head>
        <title>HTML CSS Demo Assignment</title>
        <link rel="stylesheet" href="style.css">
        <style>
            table, th , td {
                border: 1px solid black;
               border-collapse: collapse;
            }
            th, td {
                padding: 10px;
                
            }
            th,td
            {
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>HTML CSS Demo Assignment</h1>
        <table style="Width:80%">
            <tr>
                <th>Name of The Company</th>
                <th>Website</th>
                <th>Logo</th>
            </tr>
            <tr>
                <td>Infosys</td>
                <td><a href="https://www.infosys.com/">Infosys</a></td>
                <td><img src="Infosys.jpg" alt="Infosys Logo" style="width:100px;height:50px;"></td>
            </tr>
            <tr>
                <td>IBM</td>
                <td><a href="https://www.ibm.com/">IBM</a></td>
                <td><img src="IBM.png" alt="IBM Logo" style="width:100px;height:50px;"></td>
            </tr>
            <tr>
                <td>Accenture</td>
                <td><a href="https://www.accenture.com/">Accenture</a></td>
                <td><img src="Accenture.png" alt="Accenture Logo" style="width:100px;height:50px;"></td>
            </tr>
            <tr>
                <td>Oracle</td>
                <td><a href="https://www.oracle.com/">Oracle</a></td>
                <td><img src="Oracle.png" alt="Oracle Logo" style="width:100px;height:50px;"></td>
            </tr>




        </table>
    </body>
</html>
