<html>
    <head>
        <h1>Java Script can Validate Input</h1>
        
    </head>
    <body>
         <p>Please enter a number between 1 and 10:</p>
        <input type="number" id="numberInput">
        <button type="button" onclick="validateInput()">Check Number</button>
        <p id="demo"></p>

        <script>
            function validateInput() {
                var x = document.getElementById("numberInput").value;
                var text;
                if (isNaN(x) || x < 1 || x > 10) {
                    text = "Input not valid";
                    
                } else {
                    text = "Input OK";
                }
                document.getElementById("demo").innerHTML = text;
            }
        </script>
    </body>

</html>
